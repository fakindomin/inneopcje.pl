name: Build product database

on:
  schedule:
    # Weekly, not hourly - new phone/TV models don't appear often enough to
    # justify spending Gemini quota checking for them every hour (that
    # budget is better spent on the live per-view price refresh instead,
    # see app/api/phone/[slug]/price/route.js in the innaopcja.pl repo).
    # Runs Monday at 03:00 UTC, low-traffic and no particular deadline to
    # hit - unlike the price refresh, discovery has no reason to land at
    # any specific time. Still fine to run more often on demand via
    # workflow_dispatch if a fresh check is ever wanted sooner.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # scripts/build.js's own 38-minute JOB_TIME_BUDGET_MS is the real stopping
    # mechanism (leaves ~2 min of margin under this); this is just the hard
    # safety ceiling. Pacing between Gemini calls scales with how many
    # GEMINI_API_KEY* secrets are configured (lib/gemini.js's
    # geminiCallDelayMs) — more keys means more calls fit in the same budget.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
