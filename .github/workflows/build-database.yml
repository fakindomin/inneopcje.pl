name: Build product database

on:
  schedule:
    # 09:00 UTC daily — confirmed live that the free-tier daily quota does NOT
    # reset at UTC midnight (a 06:00 UTC run hit RESOURCE_EXHAUSTED from the
    # previous day's usage). Google's quotas commonly reset at US Pacific
    # midnight, which is 07:00 UTC (PDT) or 08:00 UTC (PST) — 09:00 UTC stays
    # safely after that reset year-round regardless of daylight saving.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # BATCH_SIZE=450 in scripts/build.js @ ~4.2s/call is ~32 minutes worst case.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
