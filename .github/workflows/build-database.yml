name: Build product database

on:
  schedule:
    # Hourly, not a single guessed daily time. Confirmed live that the
    # free-tier daily quota doesn't reset at UTC midnight, and rather than
    # pin a specific hour and hope it's right, each run just checks whether
    # there's quota to use (build.js exits in seconds if not — see
    # QuotaExceededError in lib/gemini.js) and does nothing if there isn't.
    # Whichever hourly tick lands after the actual reset picks up the full
    # day's quota automatically, no guessing needed.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # BATCH_SIZE=450 in scripts/build.js @ ~4.2s/call is ~32 minutes worst case.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
