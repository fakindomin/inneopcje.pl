name: Build product database

on:
  schedule:
    # Daily, not weekly - the weekly cadence made sense for telefony/telewizory
    # (there, the only job is checking IGDB/Gemini for NEW models, which don't
    # appear often enough to justify running more). gry is a different shape
    # of problem: generate-seeds.js already swept IGDB ONCE and queued its
    # entire catalog (thousands of titles, zero Gemini cost - that's pure
    # IGDB API) into seed_queue, where it just sits as 'pending' until
    # evaluated. Each run only gets through ~450 of them in its 38-minute
    # budget (lib/gemini.js's evaluateProductsBatch is the throughput limit,
    # not candidate discovery), so a week between runs mostly means a huge
    # backlog sitting idle for no reason, not "waiting for new games to
    # exist". Runs daily at 03:00 UTC; still fine to trigger via
    # workflow_dispatch on demand too.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # scripts/build.js's own 38-minute JOB_TIME_BUDGET_MS is the real stopping
    # mechanism (leaves ~2 min of margin under this); this is just the hard
    # safety ceiling. Pacing between Gemini calls scales with how many
    # GEMINI_API_KEY* secrets are configured (lib/gemini.js's
    # geminiCallDelayMs) — more keys means more calls fit in the same budget.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
